# FluxIQ Core, self-hosted: one server, one owner, Caddy terminating TLS.
#
#   cp deploy/env/self-hosted.env.example deploy/env/self-hosted.env   # then edit it
#   docker compose -f deploy/compose/self-hosted.compose.yml up -d --build
#
# Only Caddy publishes ports (80 and 443). The panel (3000) and the client
# gateway (4777) are reachable on the compose network only, which is what
# makes FLUXIQ_TRUST_PROXY=true safe: the only peer that can set
# X-Forwarded-For is Caddy, and Caddy replaces it. The guide is
# docs/operations/self-hosting.md.
#
# Image tags: FLUXIQ_IMAGE names the image built here (or pulled); set
# CADDY_IMAGE to a digest for a release. Paths are relative to this file.

name: fluxiq

services:
  fluxiq:
    image: ${FLUXIQ_IMAGE:-fluxiq-core:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    env_file:
      - ${FLUXIQ_ENV_FILE:-../env/self-hosted.env}
    environment:
      FLUXIQ_PROFILE: self-hosted
      FLUXIQ_ROOT: /data
      FLUXIQ_TRUST_PROXY: "true"
    volumes:
      - fluxiq-data:/data
    # The root filesystem is read-only; /data is the one writable volume.
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Above FLUXIQ_DRAIN_SECONDS (30 by default) so the drain finishes before
    # the container is killed.
    stop_grace_period: 45s
    restart: unless-stopped
    networks:
      - edge

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10-alpine}
    env_file:
      - ${FLUXIQ_ENV_FILE:-../env/self-hosted.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${CADDYFILE:-../caddy/Caddyfile.example}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    depends_on:
      fluxiq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge

networks:
  edge: {}

volumes:
  # Everything FluxIQ keeps: accounts, workspaces, Flows, recordings, keys
  # sealed under users' passwords. Back it up (self-hosting.md, "Backups").
  fluxiq-data: {}
  # Caddy's certificates and ACME account.
  caddy-data: {}
  caddy-config: {}
