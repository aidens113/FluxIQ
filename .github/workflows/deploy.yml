name: Deploy

# Builds FluxIQ Core's container image and smoke-tests it on both public
# profiles (deploy/docker/smoke.sh: health, ready, discovery, non-root,
# read-only root, the gateway's Origin refusal, and a provisioning round trip
# on the service profile's private listener). It runs only when started by
# hand, never on push, and calls no model provider.
#
# The deploy job is switched off. No deployment target has been chosen, so it
# names none and holds no credential. It runs only when the repository
# variable FLUXIQ_DEPLOY_ENABLED is "true", which nobody has set; when a target
# is named, its steps, its environment (with required reviewers) and its
# secrets are added here in the same change that sets the variable.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Image build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          tags: fluxiq-core:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke, self-hosted profile
        run: bash deploy/docker/smoke.sh fluxiq-core:ci self-hosted

      - name: Smoke, service profile
        run: bash deploy/docker/smoke.sh fluxiq-core:ci service

      - name: Image size
        if: always()
        run: docker image ls fluxiq-core:ci

  deploy:
    name: Deploy (disabled until a target is named)
    needs: image
    if: ${{ vars.FLUXIQ_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: No deployment target
        run: |
          echo "No deployment target is configured for FluxIQ Core." >&2
          exit 1
